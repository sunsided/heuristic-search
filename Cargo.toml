[package]
name = "heuristic-search"
description = "Explicit-state heuristic graph search: A*, weighted and anytime, bounded-suboptimal, bidirectional and incremental search"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/heuristic-search"
readme = "README.md"
keywords = ["search", "astar", "pathfinding", "heuristic", "planning"]
categories = ["algorithms", "no-std"]

[dependencies]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
