[package]
name = "heuristic-search"
description = "Explicit-state heuristic graph search: A*, weighted and anytime, bounded-suboptimal, bidirectional, incremental and real-time search"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/heuristic-search"
readme = "README.md"
keywords = ["search", "astar", "pathfinding", "heuristic", "planning"]
categories = ["algorithms", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[features]
## The checked float cost `NonNegF64`, re-exported from `search-core`, the any-angle
## grid searches Theta* and Lazy Theta*, and Field D*, whose Euclidean costs need it.
float = ["search-core/float"]

[dependencies]
# Hash table for duplicate detection under no_std; see docs/design.md.
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
# Shared Cost, Heuristic, Goal and Budget traits; re-exported from the crate root.
search-core = { path = "../search-core", version = "0.3" }

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
proptest = "1.12"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "learning"
harness = false
